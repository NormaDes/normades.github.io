name: CI (Englora)

on:
  push:
    branches: ["**"]
    paths: ["cae-prep/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["cae-prep/**", ".github/workflows/ci.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cae-prep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cae-prep/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Validar banco de ejercicios
        run: npm run validate:seeds
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
